name: Release

# Releases are made automatically when the world version in archipelago.json changes on main
# (or by running this workflow by hand). GitHub creates the tag itself.
on:
  push:
    branches: [main]
    paths: ["worlds/warriors_orochi/archipelago.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the world version
        id: version
        run: echo "version=$(python -c "import json;print(json.load(open('worlds/warriors_orochi/archipelago.json'))['world_version'])")" >> "$GITHUB_OUTPUT"

      - name: Build the .apworld
        run: |
          mkdir -p dist
          cd worlds
          zip -r ../dist/warriors_orochi.apworld warriors_orochi -x "*/__pycache__/*"

      - name: Get Archipelago (needed to run the tests and build the tracker)
        run: |
          git clone --depth 1 https://github.com/ArchipelagoMW/Archipelago.git ap
          pip install -r ap/requirements.txt pillow pytest
          cp -r worlds/warriors_orochi ap/worlds/

      - name: Run the world's tests
        working-directory: ap
        run: python -m pytest -q worlds/warriors_orochi/test

      - name: Build the PopTracker pack
        working-directory: ap
        run: |
          PYTHONPATH=. python ../tools/make_poptracker.py ../build/pack
          cp -r ../tools/poptracker_static/. ../build/pack/
          cd ../build/pack && zip -r ../../dist/warriors_orochi_poptracker.zip .

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Warriors Orochi v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/warriors_orochi.apworld
            dist/warriors_orochi_poptracker.zip
          body: |
            Install: double-click `warriors_orochi.apworld` (Archipelago 0.6.7+).
            Tracker: put `warriors_orochi_poptracker.zip` in PopTracker's `packs` folder.
            See the README for setup and options.
